services:
  postgres:
    image: postgres:17
    container_name: forhome-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: forhome
      POSTGRES_DB: forhome
    volumes:
      - forhome_pgdata:/var/lib/postgresql/data

volumes:
  forhome_pgdata:
